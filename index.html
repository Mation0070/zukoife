<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>zuko.</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap">
<style>
/* Structure only. All text lives in content.js */
:root{--bg:#fafafa;--ink:#000;--text:#333;--muted:#757575;--line:#d9d9d9;--field:#f0f0f0;--btn:#333;--btnText:#fff;--toggle:#efefef;
--display:"Playfair Display",Georgia,"Times New Roman",serif;--sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--ink:#fff;--text:#ccc;--muted:#8a8a8a;--line:#2e2e2e;--field:#1c1c1c;--btn:#e6e6e6;--btnText:#111;--toggle:#222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--ink:#fff;--text:#ccc;--muted:#8a8a8a;--line:#2e2e2e;--field:#1c1c1c;--btn:#e6e6e6;--btnText:#111;--toggle:#222;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--ink);margin:0;text-wrap:balance}
.col{max-width:680px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

header{position:relative;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .col{display:flex;align-items:center;justify-content:space-between;height:71px}
.logo{font-family:var(--display);font-size:24px;line-height:1.3;color:var(--ink);transition:letter-spacing .4s}
.logo:hover{letter-spacing:.04em}
.right{display:flex;align-items:center;gap:36px}
nav.links{display:flex;gap:24px}
nav.links a{font-size:16px;color:var(--text);transition:color .2s}
nav.links a:hover,nav.links a.on{color:var(--ink)}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--toggle);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.round svg{width:16px;height:16px;fill:var(--ink)}
#theme:hover{transform:rotate(-35deg) scale(1.06)}
#theme.spin svg{animation:spin .6s cubic-bezier(.2,.7,.2,1)}
@keyframes spin{from{transform:rotate(-180deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.menu{display:none;background:transparent;width:32px;height:40px;border:0;padding:0;cursor:pointer;place-items:center}
.menu svg{width:22px;height:22px;stroke:var(--ink);stroke-width:1.6;fill:none}
.menu .x{display:none}.menu.open .x{display:block}.menu.open .bars{display:none}
@media(max-width:700px){
 .right{gap:10px}
 nav.links{position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:0 max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));visibility:hidden;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s,visibility .3s}
 nav.links.open{visibility:visible;opacity:1;transform:none}
 nav.links a{padding:8px 0;font-family:var(--display);font-size:22px;line-height:1.5}
 header.menu-open{border-bottom-color:transparent}
 .menu{display:grid}
}

.view{display:none;padding-block:100px 0}
.view.on{display:block}
.pagehead{padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px;position:relative}
.pagehead h1{font-size:48px;line-height:1.2}
.pagehead p{margin:10px 0 0}
@media(max-width:560px){.pagehead h1{font-size:38px}}
.empty{color:var(--muted);font-size:16px;padding:8px 0}

.posts{list-style:none;margin:0;padding:0}
.posts li{border-bottom:1px solid var(--line);position:relative}
.posts a{display:block;padding:32px 0 24px;position:relative}
.tags{display:flex;gap:20px;font-size:14px;color:var(--muted);line-height:1.4;flex-wrap:wrap}
.posts h3{font-size:24px;line-height:1.2;margin:16px 0 8px;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.posts p{margin:0}
.meta{display:flex;gap:20px;font-size:14px;color:var(--muted);margin-top:16px;line-height:1.4}
.archive .posts h3{margin-bottom:0}
.posts a:hover h3{transform:translateX(8px)}
.posts a::after{content:"\2192";position:absolute;right:4px;top:50%;font-size:20px;color:var(--ink);opacity:0;transform:translate(-10px,-50%);transition:.35s cubic-bezier(.2,.7,.2,1)}
.posts a:hover::after{opacity:1;transform:translate(0,-50%)}
.posts li::before{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.6,0,.2,1)}
.posts li:hover::before{transform:scaleX(1)}

.soft{display:inline-block;margin-top:32px;padding:8px 10px;background:var(--field);color:var(--text);border:0;border-radius:3px;cursor:pointer;font-size:16px;transition:transform .25s}
.soft:hover{color:var(--ink);transform:translateY(-2px)}
h2.sec{font-size:20px;margin:56px 0 20px}
h2.label{font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:40px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{padding:6px 11px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--text);font-size:16px;cursor:pointer;transition:transform .25s,border-color .2s}
.chip:hover{border-color:var(--muted);transform:translateY(-2px)}
.chip.on{background:var(--field)}

.prose p{margin:0 0 20px;line-height:1.6}
.prose h2{font-size:26px;margin:36px 0 16px}
.prose h3{font-size:20px;margin:28px 0 12px}
.prose ul{margin:0 0 24px;padding-left:22px}
.prose li{margin-bottom:12px;line-height:1.6}
.prose blockquote{margin:28px 0;padding-left:20px;border-left:2px solid var(--ink);font-family:var(--display);font-style:italic;font-size:22px;line-height:1.4;color:var(--ink)}
.prose a{border-bottom:1px solid var(--muted)}
.prose strong{color:var(--ink);font-weight:500}

.crumb{font-size:14px;color:var(--ink);margin-bottom:40px}
article h1{font-size:48px;line-height:1.2;margin:18px 0 12px}
@media(max-width:560px){article h1{font-size:36px}}
article .tags{color:var(--text)}
article .meta{margin-top:0;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
article .prose>p:first-child{color:var(--ink)}
.pn{display:flex;justify-content:space-between;gap:20px;padding:40px 0;border-block:1px solid var(--line);margin-top:20px}
.pn a{display:block;max-width:48%}
.pn small{display:block;font-size:14px;color:var(--muted)}
.pn span{font-family:var(--display);color:var(--text)}
.pn .next{text-align:right;margin-left:auto}
.also{list-style:none;padding:0;margin:0}
.also a{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.also b{font-family:var(--display);font-weight:400;color:var(--text);transition:padding .3s}
.also a:hover b{padding-left:6px;color:var(--ink)}
.also span{font-size:12px;color:var(--muted);white-space:nowrap}
.progress{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;z-index:40}

.res{display:grid;grid-template-columns:67px 1fr;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.cover{width:67px;aspect-ratio:2/3;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:9px;line-height:1.2;padding:6px;display:flex;align-items:flex-end;transition:transform .4s}
.res:hover .cover{transform:rotate(-4deg) translateY(-3px)}
.res h3{font-size:19px}
.res .by{font-size:12px;margin:4px 0 10px}
.res p{margin:0;font-size:13px}
.tool{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tool b{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink)}
.tool i{width:18px;height:18px;border-radius:50%;background:var(--ink)}
.tool span{font-size:12px}

label{display:block;margin:20px 0 8px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--field);color:var(--ink);font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--muted)}
textarea{min-height:140px;resize:vertical}
.sendbtn{width:100%;margin-top:20px;padding:9px;border:1px solid var(--line);border-radius:3px;background:var(--field);color:var(--text);cursor:pointer}
.note{font-size:14px;color:var(--muted);margin-top:12px;min-height:20px;overflow-wrap:anywhere}
.touch{margin-top:48px;padding-top:56px;border-top:1px solid var(--line)}
.touch h2{font-size:20px}
.touch p{margin:6px 0 24px}
.sub{display:flex;gap:12px;max-width:400px}
.sub input{flex:1;min-width:0;padding:12px}
.sub button{padding:0 11px;border:0;border-radius:3px;background:var(--btn);color:var(--btnText);cursor:pointer;transition:transform .25s}
.sub button:hover{transform:translateY(-2px)}

.hello{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:22px}
.hero h1{font-size:56px;line-height:1.12}
@media(max-width:560px){.hero h1{font-size:40px}}
.rot{display:inline-grid;vertical-align:bottom;overflow:hidden;padding-bottom:.08em}
.rot span{grid-area:1/1;font-style:italic;opacity:0;transform:translateY(100%);transition:transform .7s cubic-bezier(.7,0,.2,1),opacity .5s}
.rot span.on{opacity:1;transform:none}
.rot span.out{opacity:0;transform:translateY(-100%)}
.marquee{overflow:hidden;border-bottom:1px solid var(--line);padding:16px 0;margin-top:-24px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;width:max-content;animation:slide 32s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{font-family:var(--display);font-style:italic;font-size:18px;color:var(--muted);padding:0 22px;white-space:nowrap}
@keyframes slide{to{transform:translateX(-50%)}}

.build{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bcard{position:relative;display:block;padding:22px;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;transition:border-color .3s,transform .4s cubic-bezier(.2,.7,.2,1)}
.bcard::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .5s cubic-bezier(.7,0,.2,1)}
.bcard>*{position:relative;transition:color .3s}
.bcard:hover{transform:translateY(-3px);border-color:var(--ink)}
.bcard:hover::before{transform:none}
.bcard:hover *{color:var(--bg)}
.bcard small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bcard h3{font-size:22px;margin:8px 0 6px}
.bcard p{margin:0;font-size:14px;line-height:1.55}
@media(max-width:560px){.build{grid-template-columns:1fr}}

.wordmark{display:flex;justify-content:center;font-family:var(--display);font-size:clamp(90px,26vw,220px);line-height:.9;color:var(--ink);margin-top:90px;overflow:hidden;user-select:none;letter-spacing:-.03em}
.wordmark span{display:inline-block;transform:translateY(105%);transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.wordmark.in span{transform:none}
.totop{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer;opacity:0;transform:translateY(16px) scale(.8);pointer-events:none;transition:.4s cubic-bezier(.2,.7,.2,1);z-index:25}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:var(--ink);color:var(--bg)}
footer{border-top:1px solid var(--line)}
footer .col{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-block:22px;font-size:14px;color:var(--ink)}
footer nav{display:flex;gap:24px;flex-wrap:wrap}

/* entrance motion */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes word{from{opacity:0;transform:translateY(.45em);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.view.on .pagehead h1 .w{display:inline-block;animation:word .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*55ms)}
.view.on .pagehead{border-bottom-color:transparent}
.view.on .pagehead::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--line);transform-origin:left;animation:grow 1s .25s cubic-bezier(.6,0,.2,1) both}
.view.on .anim{animation:up .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--d,0)*70ms)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.wordmark span{transform:none}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header id="hdr"><div class="col">
  <a class="logo" id="logo" href="#home"></a>
  <div class="right">
    <nav class="links" id="links">
      <a href="#now" data-v="now">Now</a><a href="#about" data-v="about">About</a><a href="#archive" data-v="archive">Archive</a><a href="#resources" data-v="resources">Resources</a><a href="#contact" data-v="contact">Contact</a>
    </nav>
    <button class="round" id="theme" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="menu" id="menu" aria-label="Open menu"><svg class="bars" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div></header>

<main class="col" id="main"></main>

<div class="col"><div class="wordmark" id="wordmark" aria-hidden="true"></div></div>
<button class="totop" id="totop" aria-label="Back to top">&uarr;</button>
<footer><div class="col"><span id="foot"></span><nav id="footlinks"></nav></div></footer>

<script src="content.js"></script>
<script>
const S=typeof SITE!=="undefined"?SITE:{},P=(typeof POSTS!=="undefined"?POSTS:[]).filter(p=>p&&p.title);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
P.forEach((p,i)=>{p.slug=p.slug||("post-"+(i+1));p.tags=p.tags||[];const w=(p.body||"").trim().split(/\s+/).filter(Boolean).length;p.read=Math.max(1,Math.round(w/220));});

/* tiny text formatter: blank line = new paragraph */
function inline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+|#[^)\s]*)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
function fmt(t){
  t=String(t||"").replace(/\r/g,"").trim();if(!t)return"";
  return t.split(/\n\s*\n/).map(b=>{
    const lines=b.split("\n").map(l=>l.trim()).filter(Boolean);
    if(lines.every(l=>/^- /.test(l)))return"<ul>"+lines.map(l=>"<li>"+inline(l.slice(2))+"</li>").join("")+"</ul>";
    if(lines.every(l=>/^> ?/.test(l)))return"<blockquote>"+inline(lines.map(l=>l.replace(/^> ?/,"")).join(" "))+"</blockquote>";
    if(/^### /.test(lines[0]))return"<h3>"+inline(lines[0].slice(4))+"</h3>"+(lines.length>1?"<p>"+inline(lines.slice(1).join(" "))+"</p>":"");
    if(/^## /.test(lines[0]))return"<h2>"+inline(lines[0].slice(3))+"</h2>"+(lines.length>1?"<p>"+inline(lines.slice(1).join(" "))+"</p>":"");
    return"<p>"+lines.map(inline).join("<br>")+"</p>";
  }).join("");
}
const head=(t,sub)=>`<div class="pagehead"><h1>${esc(t)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div>`;
const empty=t=>`<p class="empty anim">${t}</p>`;
const tagHtml=p=>p.tags.length?`<div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:"";
const row=(p,sum)=>`<li class="anim"><a href="#post-${esc(p.slug)}">${tagHtml(p)}<h3>${esc(p.title)}</h3>${sum&&p.summary?`<p>${esc(p.summary)}</p>`:""}<div class="meta">${p.date?`<span>${esc(p.date)}</span>`:""}<span>${p.read} min read</span></div></a></li>`;
const TOPICS=[...new Set(P.flatMap(p=>p.tags))];
const H=S.home||{};

/* ---------- build views ---------- */
let html="";
const words=(H.rotatingWords||[]).filter(Boolean);
html+=`<section class="view" id="v-home"><div class="pagehead hero">${H.greeting?`<div class="hello anim">${esc(H.greeting)}</div>`:""}<h1 data-nosplit class="anim">${esc(H.headline||"")}${words.length?` <span class="rot" id="rot">${words.map((w,i)=>`<span class="${i?"":"on"}">${esc(w)}</span>`).join("")}</span>`:""}</h1>${H.subtitle?`<p class="anim">${esc(H.subtitle)}</p>`:""}</div>`;
const tp=(H.scrollingTopics||[]).filter(Boolean);
if(tp.length){const s=tp.map(t=>`<span>${esc(t)}</span>`).join("");html+=`<div class="marquee" aria-hidden="true"><div class="track">${s}${s}</div></div>`;}
if(P.length){
  html+=`${H.postsHeading?`<h2 class="label">${esc(H.postsHeading)}</h2>`:""}<ul class="posts" id="home-posts"></ul><button class="soft anim" id="more">Load More</button>`;
  if(TOPICS.length)html+=`<h2 class="sec anim">Topics</h2><div class="chips anim">${TOPICS.map(t=>`<a class="chip" href="#archive" data-topic="${esc(t)}">${esc(t)}</a>`).join("")}</div>`;
}
const PR=(S.projects||[]).filter(p=>p&&p.name);
if(PR.length)html+=`<h2 class="sec anim">Projects</h2><div class="build">${PR.map(p=>`<div class="bcard anim">${p.label?`<small>${esc(p.label)}</small>`:""}<h3>${esc(p.name)}</h3>${p.text?`<p>${esc(p.text)}</p>`:""}</div>`).join("")}</div>`;
html+=`</section>`;

const N=S.now||{};
html+=`<section class="view" id="v-now">${head("Now")}<div class="prose">${N.updated?`<p class="anim">Last updated: ${esc(N.updated)}</p>`:""}${fmt(N.text)||empty("Coming soon.")}</div></section>`;
html+=`<section class="view" id="v-about">${head("About")}<div class="prose">${fmt((S.about||{}).text)||empty("Coming soon.")}</div></section>`;
html+=`<section class="view archive" id="v-archive">${head("Archive")}${P.length?`${TOPICS.length?`<div class="chips anim" id="filters" style="margin:8px 0"></div>`:""}<ul class="posts" id="archive-posts"></ul>`:empty("No posts yet.")}</section>`;

const R=S.resources||{},B=(R.books||[]).filter(b=>b&&b.title),T=(R.tools||[]).filter(t=>t&&t.name);
html+=`<section class="view" id="v-resources">${head("Resources")}<div class="prose">${fmt(R.intro)}</div>`;
if(B.length)html+=`<h2 class="sec anim" style="font-size:16px;margin-top:32px">Books I recommend:</h2>${B.map(b=>`<div class="res anim"><div class="cover">${esc(b.title)}</div><div><h3>${esc(b.title)}</h3>${b.author?`<div class="by">by ${esc(b.author)}</div>`:""}${b.note?`<p>${esc(b.note)}</p>`:""}</div></div>`).join("")}`;
if(T.length)html+=`<h2 class="sec anim" style="font-size:16px">Tools I use:</h2>${T.map(t=>`<div class="tool anim"><b><i></i>${esc(t.name)}</b><span>${esc(t.use||"")}</span></div>`).join("")}`;
if(!B.length&&!T.length&&!R.intro)html+=empty("Coming soon.");
html+=`</section>`;

const C=S.contact||{};
html+=`<section class="view" id="v-contact">${head("Contact")}<div class="prose">${fmt(C.intro)}</div>${C.email?`<form id="form" class="anim" style="margin-top:36px"><label for="f-name">Name</label><input id="f-name" required placeholder="Your name"><label for="f-email">Email</label><input id="f-email" type="email" required placeholder="you@email.com"><label for="f-msg">Message</label><textarea id="f-msg" required placeholder="Your message"></textarea><button class="sendbtn" type="submit">Send Message</button><div class="note" id="note"></div></form>`:(C.intro?"":empty("Coming soon."))}</section>`;

html+=`<section class="view" id="v-post"><article id="article"></article></section>`;
const HP=(S.hiddenPages||[]).filter(p=>p&&p.slug);
HP.forEach(p=>{html+=`<section class="view" id="v-${esc(p.slug)}" data-hidden>${head(p.title||"")}<div class="prose">${fmt(p.text)}</div></section>`;});

const st=(S.stayInTouch||{}).text;
if(st&&C.email)html+=`<section class="touch" id="touch"><h2>Stay in touch</h2><p>${esc(st)}</p><form class="sub" id="subform"><input id="sub-email" type="email" required placeholder="name@email.com" aria-label="Your email"><button type="submit">Subscribe</button></form><div class="note" id="subnote"></div></section>`;
$("#main").innerHTML=html;

/* header, footer, wordmark */
const logo=S.logo||"";$("#logo").textContent=logo;
$("#wordmark").innerHTML=[...logo].map((c,i)=>`<span style="transition-delay:${i*.06}s">${esc(c)}</span>`).join("");
$("#foot").textContent=S.footer||"";
$("#footlinks").innerHTML=(S.links||[]).filter(l=>l&&l.label&&l.url).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
if(S.description)document.querySelector('meta[name=description]').content=S.description;

/* lists */
let shown=6,filter="All";
function drawHome(){const el=$("#home-posts");if(!el)return;el.innerHTML=P.slice(0,shown).map(p=>row(p,true)).join("");$("#more").hidden=shown>=P.length;}
function drawArchive(){const f=$("#filters");if(f)f.innerHTML=["All",...TOPICS].map(t=>`<button class="chip ${t===filter?"on":""}" data-f="${esc(t)}">${esc(t)}</button>`).join("");const a=$("#archive-posts");if(a)a.innerHTML=P.filter(p=>filter==="All"||p.tags.includes(filter)).map(p=>row(p,false)).join("");}
if($("#more"))$("#more").onclick=()=>{shown+=6;drawHome();};
drawHome();drawArchive();
document.addEventListener("click",e=>{const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;drawArchive();}const t=e.target.closest("[data-topic]");if(t){filter=t.dataset.topic;drawArchive();}});

/* routing */
function show(){
  const h=decodeURIComponent((location.hash||"#home").slice(1));
  let v=h.startsWith("post-")&&P.some(p=>"post-"+p.slug===h)?"post":h;
  if(!document.getElementById("v-"+v))v="home";
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("nav.links a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  const touch=$("#touch");if(touch)touch.hidden=(v==="contact"||!!document.querySelector("#v-"+CSS.escape(v)+"[data-hidden]"));
  if(v==="post"){
    const i=P.findIndex(x=>"post-"+x.slug===h),p=P[i],prev=P[i-1],next=P[i+1],others=P.filter(x=>x!==p).slice(0,4);
    $("#article").innerHTML=`<div class="crumb"><a href="#home">Home</a> &gt; <a href="#archive">All Posts</a></div>${tagHtml(p)}<h1>${esc(p.title)}</h1><div class="meta">${p.date?`<span>${esc(p.date)}</span>`:""}<span>${p.read} min read</span></div><div class="prose">${fmt(p.body)}</div>${prev||next?`<div class="pn">${prev?`<a href="#post-${esc(prev.slug)}"><small>Previous</small><span>${esc(prev.title)}</span></a>`:""}${next?`<a class="next" href="#post-${esc(next.slug)}"><small>Next</small><span>${esc(next.title)}</span></a>`:""}</div>`:""}${others.length?`<h2 class="sec">You might also like:</h2><ul class="also">${others.map(o=>`<li><a href="#post-${esc(o.slug)}"><b>${esc(o.title)}</b><span>${o.read} min read</span></a></li>`).join("")}</ul>`:""}`;
    document.title=p.title+" | "+(S.tabTitle||"");
  } else document.title=S.tabTitle||"";
  setMenu(false);
  const view=document.getElementById("v-"+v);
  view.querySelectorAll(".pagehead h1:not([data-nosplit])").forEach(h=>{if(!h.dataset.t)h.dataset.t=h.textContent;let i=0;h.innerHTML=h.dataset.t.split(/(\s+)/).map(w=>/^\s+$/.test(w)?w:`<span class="w" style="--i:${i++}">${esc(w)}</span>`).join("");});
  let d=0;view.querySelectorAll(".anim,.prose>*,.posts li").forEach(el=>{el.classList.add("anim");el.style.setProperty("--d",Math.min(d++,10));});
  view.classList.remove("on");void view.offsetWidth;view.classList.add("on");
  window.scrollTo(0,0);
}
function setMenu(o){$("#links").classList.toggle("open",o);$("#menu").classList.toggle("open",o);$("#hdr").classList.toggle("menu-open",o);}
$("#menu").onclick=()=>setMenu(!$("#links").classList.contains("open"));
addEventListener("hashchange",show);show();

/* rotating words */
const rot=[...document.querySelectorAll("#rot span")];let ri=0;
if(rot.length>1)setInterval(()=>{if(document.hidden)return;const c=rot[ri];ri=(ri+1)%rot.length;const n=rot[ri];c.classList.remove("on");c.classList.add("out");n.classList.remove("out");n.classList.add("on");setTimeout(()=>c.classList.remove("out"),700);},2400);

/* wordmark, back to top, reading bar */
const wm=$("#wordmark");
if("IntersectionObserver"in window)new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)wm.classList.add("in")}),{threshold:.3}).observe(wm);else wm.classList.add("in");
$("#totop").onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("scroll",()=>{const d=document.documentElement,post=$("#v-post").classList.contains("on");$("#totop").classList.toggle("show",d.scrollTop>600);$("#progress").style.transform=`scaleX(${post?Math.min(1,d.scrollTop/Math.max(1,d.scrollHeight-innerHeight)):0})`;},{passive:true});

/* theme */
const root=document.documentElement;
try{const s=localStorage.getItem("theme");if(s)root.dataset.theme=s;}catch(e){}
$("#theme").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.dataset.theme=dark?"light":"dark";const b=$("#theme");b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");try{localStorage.setItem("theme",root.dataset.theme)}catch(e){}};

/* forms open the visitor's email app */
function mail(sub,body,note){note.textContent="Opening your email app...";location.href=`mailto:${C.email}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;}
if($("#form"))$("#form").addEventListener("submit",e=>{e.preventDefault();mail("Hello from "+$("#f-name").value,$("#f-msg").value+"\n\n"+$("#f-name").value+" ("+$("#f-email").value+")",$("#note"));});
if($("#subform"))$("#subform").addEventListener("submit",e=>{e.preventDefault();mail("Subscribe","Please add "+$("#sub-email").value+" to your list.",$("#subnote"));});
</script>
</body>
</html>
